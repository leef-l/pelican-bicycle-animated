<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">骑自行车的鹈鹕 · 暮色版</title>
  <desc id="svgDesc">一只暖白色鹈鹕骑着珊瑚粉自行车，穿行在紫橙暮色、橙色落日与粉白云霞之间，，车轮、脚踏曲柄与鹈鹕的腿脚持续运动。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a63"/>
      <stop offset="0.55" stop-color="#8c4a80"/>
      <stop offset="1" stop-color="#ffae6b"/>
    </linearGradient>

    <radialGradient id="sunGlowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#ffcf8a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9e86"/>
      <stop offset="1" stop-color="#3f7059"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6478"/>
      <stop offset="0.3" stop-color="#57506a"/>
      <stop offset="1" stop-color="#3f3952"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff4ec"/>
      <stop offset="1" stop-color="#efdccb"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#f2762a"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#e87e2e"/>
    </linearGradient>

    <!-- 车轮内部（轮心位于 0,0） -->
    <g id="spokeSet">
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round" transform="rotate(45)"/>
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round" transform="rotate(90)"/>
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round" transform="rotate(135)"/>
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round" transform="rotate(180)"/>
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round" transform="rotate(225)"/>
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round" transform="rotate(270)"/>
      <line x1="0" y1="-9" x2="0" y2="-79" stroke="#b3a3cc" stroke-width="2.2" stroke-linecap="round" transform="rotate(315)"/>
      <rect x="-3.5" y="-76" width="7" height="16" rx="2.5" fill="#ffd166"/>
      <circle r="9" fill="#6a5f80"/>
      <circle r="4" fill="#efe4f5"/>
    </g>

    <!-- 云朵 -->
    <g id="cloudShape">
      <ellipse cx="0" cy="3" rx="54" ry="23" fill="#fff4ec"/>
      <circle cx="-30" cy="-8" r="22" fill="#fff4ec"/>
      <circle cx="2" cy="-16" r="27" fill="#fff4ec"/>
      <circle cx="32" cy="-4" r="20" fill="#fff4ec"/>
    </g>
  </defs>

  <!-- ================= 天空与远景 ================= -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>

  <!-- 暖黄太阳 -->
  <g transform="translate(702,96)">
    <circle r="92" fill="url(#sunGlowGrad)"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.06;1" keyTimes="0;0.5;1"
                        dur="4.5s" repeatCount="indefinite"/>
      <circle r="50" fill="#ff9f45"/>
      <circle r="41" fill="none" stroke="#ffd08a" stroke-width="7" opacity="0.55"/>
    </g>
  </g>

  <!-- 飘动白云 -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" from="900 0" to="-240 0"
                      dur="26s" repeatCount="indefinite"/>
    <use xlink:href="#cloudShape" href="#cloudShape" transform="translate(150,104) scale(1)"/>
  </g>
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" from="880 0" to="-260 0"
                      dur="36s" repeatCount="indefinite"/>
    <use xlink:href="#cloudShape" href="#cloudShape" transform="translate(430,208) scale(0.62)"/>
  </g>
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" from="920 0" to="-220 0"
                      dur="20s" repeatCount="indefinite"/>
    <use xlink:href="#cloudShape" href="#cloudShape" transform="translate(500,56) scale(0.78)"/>
  </g>

  <!-- 远山 -->
  <path d="M -30,442 C 60,392 130,372 214,442 Z" fill="#6b4a86" opacity="0.5"/>
  <path d="M 150,442 C 244,384 322,376 424,442 Z" fill="#6b4a86" opacity="0.38"/>

  <!-- 草地 -->
  <rect x="0" y="440" width="800" height="160" fill="url(#grassGrad)"/>
  <path d="M 0,441 C 132,429 252,452 382,441 C 522,429 662,450 800,439 L 800,472 L 0,472 Z"
        fill="#4f8a70" opacity="0.65"/>
  <g stroke="#2f5c49" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 62,506 q 6,-22 2,-32"/>
    <path d="M 76,508 q -4,-20 -10,-26"/>
    <path d="M 668,502 q 6,-22 1,-32"/>
    <path d="M 682,505 q -5,-20 -11,-26"/>
    <path d="M 752,509 q 6,-20 2,-28"/>
  </g>

  <!-- 灰色公路 -->
  <rect x="0" y="516" width="800" height="84" fill="url(#roadGrad)"/>
  <rect x="0" y="516" width="800" height="4" fill="#857da0" opacity="0.85"/>
  <rect x="0" y="596" width="800" height="4" fill="#2a2638" opacity="0.6"/>

  <!-- 流动虚线 -->
  <line x1="-140" y1="558" x2="940" y2="558" stroke="#ffd166" stroke-width="8"
        stroke-dasharray="70 62" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="132 0"
                      dur="1.1s" repeatCount="indefinite"/>
  </line>
  <line x1="-140" y1="528" x2="940" y2="528" stroke="#d9cbe8" stroke-width="4"
        stroke-dasharray="46 90" stroke-linecap="round" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="136 0"
                      dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- ================= 自行车 ================= -->
  <!-- 后轮（轮心 250,425） -->
  <g>
    <circle cx="250" cy="425" r="95" fill="none" stroke="#241d33" stroke-width="11"/>
    <circle cx="250" cy="425" r="83" fill="none" stroke="#cbb8e0" stroke-width="5"/>
    <g transform="translate(250,425)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
        <use xlink:href="#spokeSet" href="#spokeSet"/>
      </g>
    </g>
  </g>

  <!-- 前轮（轮心 545,425） -->
  <g>
    <circle cx="545" cy="425" r="95" fill="none" stroke="#241d33" stroke-width="11"/>
    <circle cx="545" cy="425" r="83" fill="none" stroke="#cbb8e0" stroke-width="5"/>
    <g transform="translate(545,425)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
        <use xlink:href="#spokeSet" href="#spokeSet"/>
      </g>
    </g>
  </g>

  <!-- 远侧腿（位于车架之后，随身体起伏） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0"
                      keyTimes="0; 0.5; 1" dur="1.5s" repeatCount="indefinite"/>
    <path fill="none" stroke="#d9c8b8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
          d="M 330,276 L 343,369 L 324,462">
      <animate attributeName="d" dur="1.5s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.25; 0.5; 0.75; 1"
               values="M 330,276 L 343,369 L 324,462;
                       M 330,276 L 361,351 L 360,426;
                       M 330,276 L 379,369 L 396,462;
                       M 330,276 L 361,387 L 360,498;
                       M 330,276 L 343,369 L 324,462"/>
    </path>
  </g>

  <!-- 链条 -->
  <g stroke="#6a5f80" stroke-width="3.4" fill="none">
    <path d="M 358,446 L 252,417"/>
    <path d="M 358,489 L 252,433"/>
  </g>

  <!-- 青色车架 -->
  <g stroke="#ff5d8f" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 360,468 L 512,300"/>
    <path d="M 322,296 L 512,300"/>
    <path d="M 360,468 L 322,296"/>
    <path d="M 360,468 L 250,425"/>
    <path d="M 322,296 L 250,425"/>
    <path d="M 512,300 L 545,425"/>
    <path d="M 512,300 L 510,272"/>
  </g>
  <path d="M 452,282 Q 456,266 476,265 L 546,264 Q 562,264 564,278"
        stroke="#ff5d8f" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="512" cy="300" r="7" fill="#e0447a"/>

  <!-- 车座 -->
  <path d="M 286,296 C 298,281 342,278 356,288 C 344,299 298,303 286,296 Z" fill="#2a2233"/>

  <!-- 近侧腿（车架之上、曲柄之下，随身体起伏） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0"
                      keyTimes="0; 0.5; 1" dur="1.5s" repeatCount="indefinite"/>
    <path fill="none" stroke="#fff4ec" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
          d="M 344,282 L 386,372 L 396,462">
      <animate attributeName="d" dur="1.5s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0; 0.25; 0.5; 0.75; 1"
               values="M 344,282 L 386,372 L 396,462;
                       M 344,282 L 368,390 L 360,498;
                       M 344,282 L 350,372 L 324,462;
                       M 344,282 L 368,354 L 360,426;
                       M 344,282 L 386,372 L 396,462"/>
    </path>
  </g>

  <!-- 脚踏曲柄（整体绕中轴旋转） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 360 468" to="360 360 468"
                      dur="1.5s" repeatCount="indefinite"/>
    <circle cx="360" cy="468" r="23" fill="none" stroke="#8d7ba6" stroke-width="3.5"/>
    <circle cx="360" cy="468" r="23" fill="none" stroke="#b7a5cf" stroke-width="8" stroke-dasharray="4 6"/>

    <!-- 远侧曲柄、踏板与远侧脚 -->
    <line x1="360" y1="468" x2="324" y2="468" stroke="#b3a3cc" stroke-width="9" stroke-linecap="round"/>
    <rect x="310" y="460" width="26" height="12" rx="4" fill="#3a3050"/>
    <ellipse cx="324" cy="462" rx="16" ry="13" fill="#f2a02a"/>

    <!-- 近侧曲柄、踏板与近侧脚 -->
    <line x1="360" y1="468" x2="396" y2="468" stroke="#ff5d8f" stroke-width="10" stroke-linecap="round"/>
    <rect x="382" y="459" width="28" height="13" rx="4" fill="#4a3d63"/>
    <ellipse cx="396" cy="462" rx="17" ry="14" fill="url(#beakGrad)" stroke="#d96f1e" stroke-width="2"/>
  </g>
  <circle cx="360" cy="468" r="9" fill="#e0447a"/>

  <!-- ================= 鹈鹕（随行轻微起伏） ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0"
                      keyTimes="0; 0.5; 1" dur="1.5s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M 228,254 C 198,242 168,254 150,276 C 182,284 212,278 236,266 Z"
          fill="url(#bodyGrad)" stroke="#e0cbb8" stroke-width="2"/>

    <!-- 身体 -->
    <path d="M 216,236 C 216,190 268,174 312,200 C 348,222 356,258 318,278 C 280,298 216,282 216,236 Z"
          fill="url(#bodyGrad)" stroke="#e0cbb8" stroke-width="2.5"/>

    <!-- 颈与头 -->
    <path d="M 336,228 C 358,198 394,176 424,163" stroke="#fff4ec" stroke-width="26"
          stroke-linecap="round" fill="none"/>
    <circle cx="428" cy="160" r="31" fill="url(#bodyGrad)" stroke="#e0cbb8" stroke-width="2.5"/>

    <!-- 喉袋 -->
    <path d="M 450,162 C 486,164 526,173 562,182 C 558,195 534,205 508,203 C 480,201 450,186 450,162 Z"
          fill="url(#pouchGrad)" stroke="#cc6a1e" stroke-width="2"/>
    <path d="M 458,176 C 480,186 504,194 528,197" stroke="#ffc98f" stroke-width="3"
          fill="none" opacity="0.4" stroke-linecap="round"/>

    <!-- 长喙 -->
    <path d="M 450,142 C 496,146 536,159 566,177 C 568,180 565,183 562,182 C 526,172 486,162 450,162 Z"
          fill="url(#beakGrad)" stroke="#d96f1e" stroke-width="2"/>
    <path d="M 452,161 C 488,166 524,174 561,182" stroke="#a8540e" stroke-width="2.2" fill="none" opacity="0.8"/>

    <!-- 眼睛 -->
    <circle cx="439" cy="145" r="6" fill="#241d33"/>
    <circle cx="441" cy="143" r="2.1" fill="#fff4ec"/>

    <!-- 翅膀搭在车把上（小幅扇动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 324 206; -9 324 206; 0 324 206"
                        keyTimes="0; 0.5; 1" dur="1.5s" repeatCount="indefinite"/>
      <path d="M 322,198 C 372,202 440,226 502,266 C 478,292 422,298 376,280 C 344,266 316,236 322,198 Z"
            fill="#fbf0e6" stroke="#d9c2b0" stroke-width="2.5"/>
      <path d="M 352,220 C 394,232 440,250 484,270" stroke="#e8d5c5" stroke-width="2.4" fill="none"/>
      <path d="M 346,240 C 386,254 428,270 466,286" stroke="#e8d5c5" stroke-width="2.4" fill="none"/>
    </g>
  </g>
</svg>
