<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕 · 双配色</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1f2a33;
    --muted: #5d6b78;
    --card: #ffffff;
    --line: #dfe7ee;
    --accent: #ff5d8f;
    --accent2: #12a5ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 30px 18px 40px;
    background: linear-gradient(180deg, #fdeef4 0%, #f6fbff 52%, #eef7f0 100%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.6;
  }
  main { width: min(900px, 100%); margin: 0 auto; text-align: center; }
  h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.1rem); letter-spacing: 0.04em; }
  .lead { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 22px 22px 18px;
    box-shadow: 0 18px 48px rgba(31, 42, 51, 0.12);
    margin-bottom: 24px;
  }
  section h2 { margin: 0 0 4px; font-size: 1.15rem; letter-spacing: 0.03em; }
  section .meta { margin: 0 0 16px; color: var(--muted); font-size: 0.85rem; }
  figure { margin: 0; border-radius: 16px; overflow: hidden; background: #221a33; border: 1px solid var(--line); }
  figure img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
  .actions a {
    display: inline-block; padding: 10px 20px; border-radius: 999px; font-size: 0.95rem;
    text-decoration: none; border: 1px solid var(--tone, var(--accent)); color: var(--tone, var(--accent));
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .actions a:hover, .actions a:focus-visible { background: var(--tone, var(--accent)); color: #fff; }
  section.classic { --tone: var(--accent2); }
  section.classic figure { background: #dff0fc; }
  footer { color: var(--muted); font-size: 0.82rem; }
</style>
</head>
<body>
  <main>
    <h1>骑自行车的鹈鹕</h1>
    <p class="lead">纯手写矢量插画 · 内联 SMIL 动画 · 两种配色 · 无脚本无位图无外部依赖</p>

    <section class="sunset">
      <h2>暮色版（新配色）</h2>
      <p class="meta">紫橙暮色天空、橙色落日、珊瑚粉车架、暖白鹈鹕</p>
      <figure>
        <img src="pelican-bicycle-sunset.svg" alt="一只暖白色鹈鹕骑着珊瑚粉自行车穿过紫橙暮色" width="800" height="600">
      </figure>
      <div class="actions">
        <a href="pelican-bicycle-sunset.svg" target="_blank" rel="noopener">查看 SVG</a>
        <a href="pelican-bicycle-sunset.svg" download="pelican-bicycle-sunset.svg">下载 SVG</a>
      </div>
    </section>

    <section class="classic">
      <h2>经典版（原配色）</h2>
      <p class="meta">浅蓝天空、暖黄太阳、青色车架、白色鹈鹕</p>
      <figure>
        <img src="pelican-bicycle.svg" alt="一只白色鹈鹕骑着青色自行车在浅蓝天空下前行" width="800" height="600">
      </figure>
      <div class="actions">
        <a href="pelican-bicycle.svg" target="_blank" rel="noopener">查看 SVG</a>
        <a href="pelican-bicycle.svg" download="pelican-bicycle.svg">下载 SVG</a>
      </div>
    </section>

    <footer>车轮与脚踏曲柄旋转、鹈鹕随行起伏、翅膀小幅扇动，周期均为 1.5 秒线性循环。</footer>
  </main>
</body>
</html>
